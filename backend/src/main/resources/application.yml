server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banking-transaction-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:banking_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BankingHikariCP
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      format_sql: true
      jdbc:
        time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

banking:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      mfa-pending-expiration-ms: ${JWT_MFA_PENDING_EXPIRATION_MS:300000}
    amfa:
      enabled: ${AMFA_ENABLED:true}
      secret-encryption-key: ${AMFA_SECRET_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      otp-expiration-seconds: ${AMFA_OTP_EXPIRATION_SECONDS:300}
      otp-resend-cooldown-seconds: ${AMFA_OTP_RESEND_COOLDOWN_SECONDS:60}
      otp-max-attempts: ${AMFA_OTP_MAX_ATTEMPTS:5}
      challenge-expiration-seconds: ${AMFA_CHALLENGE_EXPIRATION_SECONDS:300}
      trusted-device-ttl-days: ${AMFA_TRUSTED_DEVICE_TTL_DAYS:30}
      max-failed-login-attempts: ${AMFA_MAX_FAILED_LOGIN_ATTEMPTS:5}
      lockout-duration-minutes: ${AMFA_LOCKOUT_DURATION_MINUTES:15}
      rate-limit-window-seconds: ${AMFA_RATE_LIMIT_WINDOW_SECONDS:300}
      rate-limit-max-requests: ${AMFA_RATE_LIMIT_MAX_REQUESTS:10}
      high-value-transfer-threshold: ${AMFA_HIGH_VALUE_TRANSFER_THRESHOLD:25000}
      critical-value-transfer-threshold: ${AMFA_CRITICAL_VALUE_TRANSFER_THRESHOLD:500000}
      weights:
        unrecognized-device: 30
        new-browser: 15
        ip-change: 15
        failed-attempts: 25
        high-value-tx: 30
        high-frequency-tx: 25
        sensitive-operation: 30
      mail-from: ${AMFA_MAIL_FROM:no-reply@bank.internal}
  concurrency:
    worker-pool-size: 10
    queue-capacity: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [txnId=%X{txnId:-NONE}] - %msg%n"
  level:
    root: INFO
    com.bank.transaction: DEBUG
